<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitro OS - Liquid Edition</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.2);
    --accent: #00e5ff;
    --focus-glow: 0 0 30px rgba(0, 229, 255, 0.8);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; background: #000;
  }

  /* 1. BOOT SCREEN */
  #bootScreen {
    position: fixed; inset: 0; background: radial-gradient(circle, #0f172a, #020617);
    z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s ease;
  }
  .boot-logo { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 20px rgba(0,229,255,0.5); }
  .boot-sub { font-size: 14px; opacity: 0.6; margin-top: 10px; }

  /* 2. LOCK SCREEN */
  #lockScreen {
    position: fixed; inset: 0; z-index: 5000;
    background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #lockScreen.unlocked { transform: translateY(-100%); }
  .lock-clock { font-size: 84px; font-weight: 300; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  .lock-date { font-size: 20px; opacity: 0.8; margin-top: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .swipe-hint { position: absolute; bottom: 40px; font-size: 14px; opacity: 0.7; letter-spacing: 1.5px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* 3. MAIN OS WORKSPACE */
  #mainWorkspace {
    width: 100vw; height: 100vh;
    background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
    display: flex; position: relative; overflow: hidden;
  }
  #mainWorkspace::after {
    content: ''; position: absolute; inset: 0; background: rgba(2, 6, 23, 0.45); backdrop-filter: blur(10px); z-index: 1;
  }

  /* Left Vertical Pill Bar */
  .left-pill-bar {
    position: relative; z-index: 10; width: 90px; height: 85vh; margin: auto 24px;
    background: var(--glass-bg); backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border); border-radius: 45px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 25px 0;
  }
  .pill-icon {
    font-size: 26px; width: 55px; height: 55px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
  }

  /* Right Content Area */
  .content-area {
    position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 40px;
  }

  /* Top Bar */
  .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
  .glass-pill-btn {
    padding: 10px 20px; border-radius: 20px; background: var(--glass-bg);
    backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: #fff; font-size: 14px; cursor: pointer;
  }

  /* Center Apps & Windows 12 Dock */
  .center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .section-title { font-size: 18px; font-weight: 600; letter-spacing: 1px; opacity: 0.8; }
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .app-card {
    height: 130px; border-radius: 24px; background: var(--glass-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; cursor: pointer; transition: 0.2s;
  }

  /* Focusable D-Pad Highlight */
  .focusable:focus, .focusable.tv-focus {
    outline: none; transform: scale(1.08) translateY(-4px);
    border-color: var(--accent); box-shadow: var(--focus-glow); background: rgba(255,255,255,0.18); z-index: 20;
  }

  /* Fullscreen App Runner */
  #runnerModal {
    position: fixed; inset: 0; background: #000; z-index: 99999; display: none; flex-direction: column;
  }
  #runnerFrame { flex: 1; width: 100%; border: none; background: #000; }
</style>
</head>
<body>

  <!-- 1. BOOT SCREEN (3 Seconds Auto Clean) -->
  <div id="bootScreen">
    <div class="boot-logo">NITRO OS</div>
    <div class="boot-sub">Cleaning Cache & Initializing Rust Core...</div>
  </div>

  <!-- 2. LOCK SCREEN -->
  <div id="lockScreen">
    <div class="lock-clock" id="lockClock">12:00</div>
    <div class="lock-date" id="lockDate">Monday, November 9</div>
    <div class="swipe-hint">▲ Press Any D-Pad Button to Unlock</div>
  </div>

  <!-- 3. MAIN WORKSPACE -->
  <div id="mainWorkspace">
    <!-- Left Vertical Pill Bar -->
    <div class="left-pill-bar">
      <div style="font-size:22px; color:var(--accent);">⚡</div>
      <div style="display:flex; flex-direction:column; gap:15px;">
        <div class="pill-icon focusable" tabindex="0" onclick="switchTab('home')">🏠</div>
        <div class="pill-icon focusable" tabindex="0" onclick="switchTab('search')">🔍</div>
        <div class="pill-icon focusable" tabindex="0" onclick="switchTab('apps')">📦</div>
        <div class="pill-icon focusable" tabindex="0" onclick="switchTab('recents')">📑</div>
      </div>
      <div class="pill-icon focusable" tabindex="0" onclick="openSettings()">⚙️</div>
    </div>

    <!-- Right Content -->
    <div class="content-area">
      <!-- Top Bar -->
      <div class="top-bar">
        <button class="glass-pill-btn focusable" tabindex="0" onclick="refreshSystem()">🔄 Boost RAM</button>
        <button class="glass-pill-btn focusable" tabindex="0" id="clockBtn">12:00 PM</button>
      </div>

      <!-- Main Stage -->
      <div class="center-stage">
        <div class="section-title" id="stageTitle">Nitro Dashboard</div>
        <div class="app-grid" id="appGrid"></div>
      </div>
    </div>
  </div>

  <!-- App Runner Modal -->
  <div id="runnerModal">
    <iframe id="runnerFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>

<script>
  let isUnlocked = false;

  // 1. Boot Screen Timer (3 Seconds)
  setTimeout(() => {
    document.getElementById("bootScreen.style.opacity") = "0";
    setTimeout(() => document.getElementById("bootScreen").style.display = "none", 600);
  }, 3000);

  // Clock Update
  setInterval(() => {
    const d = new Date();
    const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById("lockClock").innerText = timeStr;
    document.getElementById("clockBtn").innerText = timeStr;
  }, 1000);

  // Default Apps
  const apps = [
    { name: "YouTube TV", icon: "▶️", pkg: "com.google.android.youtube.tv", type: "native" },
    { name: "SmartTube", icon: "📺", pkg: "com.liskovsoft.smarttubetv.beta", type: "native" },
    { name: "Browser Pad", icon: "🌐", code: "<body style='background:#05070f;color:#0ff;display:flex;justify-content:center;align-items:center;height:100vh;'><h1>Nitro Web Engine Active</h1></body>", type: "webx" }
  ];

  function renderApps() {
    const grid = document.getElementById("appGrid");
    grid.innerHTML = "";
    apps.forEach(app => {
      const card = document.createElement("div");
      card.className = "app-card focusable";
      card.tabIndex = 0;
      card.innerHTML = `<div style="font-size:38px;">${app.icon}</div><div style="font-weight:600; font-size:14px;">${app.name}</div>`;
      card.onclick = () => {
        if (app.type === "native" && window.NitroNative) {
          window.NitroNative.launchNativeApp(app.pkg);
        } else if (app.code) {
          document.getElementById("runnerModal").style.display = "flex";
          document.getElementById("runnerFrame").srcdoc = app.code;
        }
      };
      grid.appendChild(card);
    });
    refreshFocusables();
  }

  // Handle D-Pad Unlock & Navigation
  window.addEventListener("keydown", (e) => {
    if (!isUnlocked) {
      // Any D-Pad or OK unlocks the lock screen
      isUnlocked = true;
      document.getElementById("lockScreen").classList.add("unlocked");
      refreshFocusables();
      e.preventDefault();
      return;
    }

    if (document.getElementById("runnerModal").style.display === "flex") return;

    // Standard D-Pad Grid Navigation
    focusItems = Array.from(document.querySelectorAll(".focusable"));
    if (!focusItems.length) return;

    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      focusIndex = (focusIndex + 1) % focusItems.length;
      focusItems[focusIndex].focus();
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      focusIndex = (focusIndex - 1 + focusItems.length) % focusItems.length;
      focusItems[focusIndex].focus();
    } else if (e.key === "Enter") {
      e.preventDefault();
      focusItems[focusIndex].click();
    }
  });

  window.onNitroBack = function() {
    const modal = document.getElementById("runnerModal");
    if (modal.style.display === "flex") {
      modal.style.display = "none";
      document.getElementById("runnerFrame").srcdoc = "";
      refreshFocusables();
    }
  };

  function openSettings() {
    if (window.NitroNative) window.NitroNative.openSystemSettings();
  }
  function refreshSystem() {
    alert("Nitro Rust Core: RAM Optimized & Cache Cleared!");
  }
  function switchTab(tab) {
    document.getElementById("stageTitle").innerText = "Nitro " + tab.toUpperCase();
  }

  let focusIndex = 0;
  let focusItems = [];
  function refreshFocusables() {
    focusItems = Array.from(document.querySelectorAll(".focusable"));
    if (focusItems.length > 0) {
      focusIndex = Math.min(focusIndex, focusItems.length - 1);
      focusItems[focusIndex].focus();
    }
  }

  renderApps();
</script>
</body>
  </html>
